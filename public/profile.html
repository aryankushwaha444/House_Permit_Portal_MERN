<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" type="image/png" href="/assets/images/logo.png" class="logo" />
    <title>Profile | House Permit Portal</title>
    <link rel="stylesheet" href="/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <header>
      <nav>
        <a class="logo" href="/"
          ><i class="fas fa-home"></i> House Permit</a
        >
        <div class="nav-right" id="navRight"></div>
      </nav>
    </header>
    <main class="auth-container">
      <section class="auth-card">
        <h1>Your Profile</h1>
        <p id="profileName"></p>
        <p id="profileEmail"></p>
        <a href="/dashboard/">Back to dashboard</a>
      </section>
    </main>
    <footer>
      <div class="footer-content">
        <p>&copy; 2026 House Permit System. All rights reserved.</p>
      </div>
    </footer>
    <script src="/js/common/auth.js"></script>
    <script src="/js/common/siteChrome.js"></script>
    <script>
      const user = requireAuth();
      if (user) {
        profileName.textContent = user.fullName;
        profileEmail.textContent = user.email;
      }
    </script>
  </body>
</html>
