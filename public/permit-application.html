<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>House Permit Application</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    />
  </head>
  <body>
    <header>
      <nav>
        <a
          class="logo"
          href="/index.html"
          aria-label="Go to House Permit home page"
        >
          <i class="fas fa-home"></i>
          House Permit
        </a>
        <div class="nav-right" id="navRight"></div>
      </nav>
    </header>

    <main class="permit-container">
      <div class="permit-card">
        <h1>House Permit Application</h1>
        <form
          id="permitForm"
          onsubmit="handlePermitSubmit(event)"
          enctype="multipart/form-data"
        >
          <div class="form-group">
            <label for="propertyAddress">Property Address</label>
            <textarea
              id="propertyAddress"
              name="propertyAddress"
              required
            ></textarea>
          </div>
          <div class="form-group">
            <label for="propertyType">Property Type</label>
            <select id="propertyType" name="propertyType" required>
              <option value="">Select Property Type</option>
              <option value="residential">Residential</option>
              <option value="commercial">Commercial</option>
              <option value="mixed">Mixed Use</option>
            </select>
          </div>
          <div class="form-group">
            <label for="constructionType">Construction Type</label>
            <select id="constructionType" name="constructionType" required>
              <option value="">Select Construction Type</option>
              <option value="new">New Construction</option>
              <option value="renovation">Renovation</option>
              <option value="addition">Addition</option>
            </select>
          </div>
          <div class="form-group">
            <label for="plotArea">Plot Area (sq. ft)</label>
            <input
              type="number"
              id="plotArea"
              name="plotArea"
              required
              min="0"
            />
          </div>
          <div class="form-group">
            <label for="buildingArea">Building Area (sq. ft)</label>
            <input
              type="number"
              id="buildingArea"
              name="buildingArea"
              required
              min="0"
            />
          </div>
          <div class="form-group">
            <label for="estimatedCost">Estimated Cost (NPR)</label>
            <input
              type="number"
              id="estimatedCost"
              name="estimatedCost"
              required
              min="0"
            />
          </div>
          <div class="form-group">
            <label for="documents"
              >Upload Documents (Blueprint, Land Ownership, etc.)</label
            >
            <p class="file-hint">
              Upload any relevant documents for your application
            </p>
            <input
              type="file"
              id="documents"
              name="documents"
              multiple
            />
          </div>
          <div
            id="uploadProgress"
            class="upload-progress"
            style="display: none"
          >
            <div class="progress-bar">
              <div class="progress-fill"></div>
            </div>
            <p class="progress-text">Uploading files...</p>
          </div>
          <button type="submit" class="submit-btn">Submit Application</button>
        </form>
      </div>
    </main>
    <footer>
      <div class="footer-content">
        <p>&copy; 2025 House Permit System. All rights reserved.</p>
      </div>
    </footer>

    <script src="/js/common/siteChrome.js"></script>

    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const permitId = urlParams.get("id");
      const isEditMode = Boolean(permitId);
    
      // ==============================
      // CHECK AUTHENTICATION
      // ==============================
      async function checkAuth() {
        const user = JSON.parse(localStorage.getItem("user"));
    
        if (!user || !user.token) {
          window.location.href = "/login.html";
          return;
        }
    
        try {
          const response = await fetch("/api/auth/verify", {
            method: "GET",
            headers: {
              Authorization: `Bearer ${user.token}`,
            },
          });
    
          if (!response.ok) {
            throw new Error("Authentication failed");
          }
    
          renderPortalNavigation();
    
          // Load existing permit when editing
          if (isEditMode) {
            await loadPermitForEdit();
          }
        } catch (error) {
          console.error("Auth error:", error);
          localStorage.removeItem("user");
          window.location.href = "/login.html";
        }
      }
    
      // ==============================
      // LOAD PERMIT FOR EDITING
      // ==============================
      async function loadPermitForEdit() {
        try {
          const user = JSON.parse(localStorage.getItem("user"));
    
          const response = await fetch(`/api/permits/${permitId}/edit`, {
            method: "GET",
            headers: {
              Authorization: `Bearer ${user.token}`,
            },
          });
    
          const data = await response.json();
    
          if (!response.ok) {
            throw new Error(data.error || "Failed to load permit");
          }
    
          console.log("Permit loaded for editing:", data);
    
          // Fill form fields
          document.getElementById("propertyAddress").value =
            data.propertyAddress || "";
    
          document.getElementById("propertyType").value =
            data.propertyType || "";
    
          document.getElementById("constructionType").value =
            data.constructionType || "";
    
          document.getElementById("plotArea").value =
            data.plotArea ?? "";
    
          document.getElementById("buildingArea").value =
            data.buildingArea ?? "";
    
          document.getElementById("estimatedCost").value =
            data.estimatedCost ?? "";
    
          // Change heading
          const heading = document.querySelector("h1");
    
          if (heading) {
            heading.textContent = "Edit Permit Application";
          }
    
          // Change submit button
          const submitButton = document.querySelector(".submit-btn");
    
          if (submitButton) {
            submitButton.innerHTML =
              '<i class="fas fa-pen-to-square"></i> Update Application';
          }
    
          // Change document hint
          const fileHint = document.querySelector(".file-hint");
    
          if (fileHint) {
            fileHint.textContent =
              "Upload new documents only if you want to replace the existing documents.";
          }
        } catch (error) {
          console.error("Error loading permit:", error);
    
          const form = document.getElementById("permitForm");
    
          if (form) {
            const errorMessage = document.createElement("div");
            errorMessage.className = "error-message";
            errorMessage.textContent = error.message;
            form.insertBefore(errorMessage, form.firstChild);
          }
        }
      }
    
      // ==============================
      // HANDLE LOGOUT
      // ==============================
      function handleLogout() {
        localStorage.removeItem("user");
        window.location.href = "/login.html";
      }
    
      // ==============================
      // SUBMIT / UPDATE PERMIT
      // ==============================
      async function handlePermitSubmit(event) {
        event.preventDefault();
    
        const user = JSON.parse(localStorage.getItem("user"));
    
        if (!user || !user.token) {
          window.location.href = "/login.html";
          return;
        }
    
        const form = event.target;
        const formData = new FormData(form);
    
        const submitBtn = form.querySelector(".submit-btn");
        const uploadProgress = document.getElementById("uploadProgress");
        const progressFill =
          uploadProgress.querySelector(".progress-fill");
        const progressText =
          uploadProgress.querySelector(".progress-text");
    
        try {
          // ==============================
          // VALIDATE FORM
          // ==============================
          const requiredFields = [
            "propertyAddress",
            "propertyType",
            "constructionType",
            "plotArea",
            "buildingArea",
            "estimatedCost",
          ];
    
          const missingFields = requiredFields.filter(
            (field) => !formData.get(field)
          );
    
          if (missingFields.length > 0) {
            throw new Error(
              `Please fill in all required fields: ${missingFields.join(", ")}`
            );
          }
    
          // ==============================
          // FILE VALIDATION
          // ==============================
          const files = form.querySelector("#documents").files;
    
          // Only require documents for NEW applications
          if (!isEditMode && files.length === 0) {
            throw new Error("Please upload at least one document");
          }
    
          // ==============================
          // UI
          // ==============================
          submitBtn.disabled = true;
    
          submitBtn.innerHTML = isEditMode
            ? '<i class="fas fa-spinner fa-spin"></i> Updating...'
            : '<i class="fas fa-spinner fa-spin"></i> Submitting...';
    
          uploadProgress.style.display = "block";
          progressFill.style.width = "0%";
          progressText.textContent = "Preparing files...";
    
          // ==============================
          // SIMULATE PROGRESS
          // ==============================
          let progress = 0;
    
          const progressInterval = setInterval(() => {
            if (progress < 90) {
              progress += 10;
              progressFill.style.width = `${progress}%`;
              progressText.textContent = `Uploading... ${progress}%`;
            }
          }, 200);
    
          // ==============================
          // CREATE OR UPDATE
          // ==============================
          const url = isEditMode
            ? `/api/permits/${permitId}`
            : "/api/permits";
    
          const method = isEditMode ? "PUT" : "POST";
    
          const response = await fetch(url, {
            method,
            headers: {
              Authorization: `Bearer ${user.token}`,
            },
            body: formData,
          });
    
          clearInterval(progressInterval);
    
          progressFill.style.width = "100%";
          progressText.textContent = "Upload complete!";
    
          const data = await response.json();
    
          if (!response.ok) {
            if (response.status === 401) {
              localStorage.removeItem("user");
              window.location.href = "/login.html";
              return;
            }
    
            throw new Error(
              data.error ||
                data.message ||
                (isEditMode
                  ? "Failed to update application"
                  : "Failed to submit application")
            );
          }
    
          // ==============================
          // SUCCESS
          // ==============================
          const successMessage = document.createElement("div");
          successMessage.className = "success-message";
          successMessage.textContent =
            data.message ||
            (isEditMode
              ? "Application updated successfully!"
              : "Application submitted successfully!");
    
          form.insertBefore(successMessage, form.firstChild);
    
          setTimeout(() => {
            window.location.href = "/dashboard/";
          }, 1500);
    
        } catch (error) {
          console.error("Error:", error);
    
          const errorMessage = document.createElement("div");
          errorMessage.className = "error-message";
          errorMessage.textContent = error.message;
    
          form.insertBefore(errorMessage, form.firstChild);
    
          setTimeout(() => {
            errorMessage.remove();
          }, 5000);
    
        } finally {
          submitBtn.disabled = false;
    
          submitBtn.innerHTML = isEditMode
            ? '<i class="fas fa-pen-to-square"></i> Update Application'
            : "Submit Application";
    
          uploadProgress.style.display = "none";
        }
      }
    
      // ==============================
      // PAGE LOAD
      // ==============================
      document.addEventListener("DOMContentLoaded", checkAuth);
    </script>
    
  </body>
</html>
