<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - House Permit System</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <a href="/index.html" style="text-decoration: none; color: inherit; display: flex; align-items: center;">
                    <i class="fas fa-home"></i>
                    House Permit
                </a>
            </div>
            <div class="nav-right" id="navRight"></div>
        </nav>
    </header>

    <main class="auth-container">
        <div class="auth-card">
            <h1>Register</h1>
            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required minlength="6">
                </div>
                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>
                <div class="form-group">
                    <label for="address">Address</label>
                    <textarea id="address" name="address" required></textarea>
                </div>
                <button type="submit" class="submit-btn">Register</button>
            </form>
            <p class="auth-link">Already have an account? <a href="/login.html">Login here</a></p>
        </div>
    </main>
    <footer>
        <div class="footer-content">
            <p>&copy; 2025 House Permit System. All rights reserved.</p>
        </div>
    </footer>

    <script>
        async function handleRegister(event) {
            event.preventDefault();
            
            const formData = {
                fullName: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                phone: document.getElementById('phone').value,
                address: document.getElementById('address').value
            };

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Registration failed');
                }

                localStorage.setItem('token', data.token);
                window.location.href = '/user-dashboard.html';
            } catch (error) {
                alert(error.message);
            }
        }
    </script>
</body>
</html>
