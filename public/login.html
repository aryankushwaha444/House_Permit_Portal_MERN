<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      href="/assets/images/logo.png"
      class="logo"
    />
    <title>Login - House Permit System</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    />
  </head>
  <body>
    <header>
      <nav>
        <div class="logo">
          <a
            href="/"
            style="
              text-decoration: none;
              color: inherit;
              display: flex;
              align-items: center;
            "
          >
            <i class="fas fa-home"></i>
            House Permit
          </a>
        </div>
        <div class="nav-right" id="navRight"></div>
      </nav>
    </header>

    <main class="auth-container">
      <div class="auth-card">
        <h1>Login</h1>
        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-wrapper">
              <input type="password" id="password" name="password" required />
              <i class="fas fa-eye password-toggle" id="passwordToggle"></i>
            </div>
          </div>
          <button type="submit" class="submit-btn">Login</button>
        </form>
        <p class="auth-link">
          Don't have an account? <a href="/register">Register here</a>
        </p>
      </div>
    </main>
    <footer>
      <div class="footer-content">
        <p>&copy; 2025 House Permit System. All rights reserved.</p>
      </div>
    </footer>

    <script src="/js/common/siteChrome.js"></script>

    <script>
      async function handleLogin(event) {
        event.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        try {
          const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ email, password }),
          });

          const data = await response.json();

          if (response.ok) {
            // Store user data and token
            localStorage.setItem(
              "user",
              JSON.stringify({
                token: data.token,
                fullName: data.user.fullName,
                email: data.user.email,
                role: data.user.role,
              })
            );

            // Redirect based on role
            if (data.user.role === "admin") {
              window.location.href = "/admin-dashboard";
            } else {
              window.location.href = "/dashboard/";
            }
          } else {
            const errorDiv = document.createElement("div");
            errorDiv.className = "error-message";
            errorDiv.textContent =
              data.error || "Login failed. Please try again.";

            const form = document.getElementById("loginForm");
            form.insertBefore(errorDiv, form.firstChild);

            setTimeout(() => {
              errorDiv.remove();
            }, 3000);
          }
        } catch (error) {
          console.error("Error:", error);

          const errorDiv = document.createElement("div");
          errorDiv.className = "error-message";
          errorDiv.textContent = "Network error. Please try again.";

          const form = document.getElementById("loginForm");
          form.insertBefore(errorDiv, form.firstChild);

          setTimeout(() => {
            errorDiv.remove();
          }, 3000);
        }
      }

      // Password show/hide
      const passwordToggle = document.getElementById("passwordToggle");
      const passwordInput = document.getElementById("password");

      passwordToggle.addEventListener("click", () => {
        const isPassword = passwordInput.type === "password";

        passwordInput.type = isPassword ? "text" : "password";

        passwordToggle.classList.toggle("fa-eye", !isPassword);
        passwordToggle.classList.toggle("fa-eye-slash", isPassword);
      });
    </script>
  </body>
</html>
